name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan available Git history without printing matches
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/scanner-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/scanner-bin" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/default-gitleaks.toml"
          touch "$RUNNER_TEMP/no-gitleaks-ignore"
          if "$RUNNER_TEMP/scanner-bin/gitleaks" git . --no-banner --redact=100 --log-opts='--all' --config "$RUNNER_TEMP/default-gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaks-ignore" > "$RUNNER_TEMP/secret-scan.log" 2>&1; then
            echo 'Secret scan passed for the available Git history; this is not a privacy certification.'
          else
            echo 'Secret scan did not pass. Reproduce privately with Gitleaks 8.30.1; no matches are printed in CI.'
            exit 1
          fi
