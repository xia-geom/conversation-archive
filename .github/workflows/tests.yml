name: Synthetic pipeline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Source, editorial-quality and publication regressions (invented records only)
        run: python -m unittest discover -s tests -v
      - name: Check the public reading command
        run: python -m conversation_archive reading --help
      - name: Exercise existing extraction and Markdown workflows
        run: |
          python -m conversation_archive.demo --output data/autonomy-ci-demo
          python -m conversation_archive.demo --markdown --output data/markdown-ci-demo
