name: Local knowledge map
on:
  push:
    branches: [feat/local-knowledge-map]
    paths: ['.github/workflows/knowledge-map.yml']
permissions:
  contents: read
jobs:
  dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Collect tracked source and pinned upstream library for offline testing
        run: |
          mkdir -p "$RUNNER_TEMP/map-review"
          git archive HEAD > "$RUNNER_TEMP/map-review/source.tar"
          curl --fail --silent --show-error --max-time 30 https://raw.githubusercontent.com/cytoscape/cytoscape.js/716a1cb6c6015d57b674abe626deaeb5e817ee30/dist/cytoscape.min.js -o "$RUNNER_TEMP/map-review/cytoscape.min.js"
          curl --fail --silent --show-error --max-time 30 https://raw.githubusercontent.com/cytoscape/cytoscape.js/716a1cb6c6015d57b674abe626deaeb5e817ee30/LICENSE -o "$RUNNER_TEMP/map-review/LICENSE.cytoscape"
          cd "$RUNNER_TEMP/map-review"
          sha256sum cytoscape.min.js LICENSE.cytoscape > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-map-development-inputs
          path: ${{ runner.temp }}/map-review/
          retention-days: 1
          if-no-files-found: error
