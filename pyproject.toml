[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-archive"
version = "0.1.1"
description = "Traceable, loss-conscious conversation export normalization"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
conversation-archive = "conversation_archive.__main__:main"

[tool.setuptools.packages.find]
include = ["conversation_archive*"]
