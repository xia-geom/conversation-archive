[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-archive"
version = "0.1.2a1"
description = "Traceable, loss-conscious conversation export normalization"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/xia-geom/conversation-archive"
Documentation = "https://github.com/xia-geom/conversation-archive/blob/main/docs/README.md"
Issues = "https://github.com/xia-geom/conversation-archive/issues"

[project.scripts]
conversation-archive = "conversation_archive.__main__:main"

[tool.setuptools.packages.find]
include = ["conversation_archive*"]
